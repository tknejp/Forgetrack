name: forgetrack
description: "Fitness tracker – Health Connect, kalorické tabulky a Google Sheets sync."
publish_to: 'none'

version: 0.2.0+3

environment:
  sdk: ^3.5.0

dependencies:
  sentry_flutter: ^9.20.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Transitive via Flutter SDK; promoted to a direct dep so lib/domain/
  # can use @immutable without importing package:flutter/foundation.dart
  # (forbidden in pure-domain files by test/domain_purity_test.dart).
  meta: ^1.11.0

  # --- Fitness data (Health Connect na Androidu) ---
  health: ^13.3.1

  # --- Google autentizace + Sheets API v4 ---
  google_sign_in: ^7.2.0      # authenticatedClient() zabudován přímo (v7.x)
  googleapis: ^16.0.0
  googleapis_auth: ^2.0.0

  # --- HTTP klient pro kalorické REST API ---
  http: ^1.2.1

  # --- Kalorické Tabulky: hashing + bezpečné uložení přihlašovacích údajů ---
  crypto: ^3.0.3
  flutter_secure_storage: ^10.0.0

  # --- State management ---
  provider: ^6.1.2

  # --- UI assets ---
  flutter_svg: ^2.0.17

  # --- Grafy ---
  fl_chart: ^1.2.0

  # --- Local database ---
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3

  # --- Utility ---
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  firebase_core: ^4.7.0
  cloud_firestore: ^6.3.0
  firebase_auth: ^6.4.0

  # --- Background sync + lokální notifikace ---
  workmanager: ^0.9.0
  flutter_local_notifications: ^18.0.0

  # --- DevTools factory reset: open Android Health Connect / app settings ---
  app_settings: ^6.1.1

  # --- Firebase Cloud Messaging (push notifikace) ---
  firebase_messaging: ^16.2.0
  wakelock_plus: ^1.5.2
  connectivity_plus: ^7.1.1
  cached_network_image: ^3.4.1

  # --- High refresh rate (90/120 Hz) opt-in on Android.
  #     Android defaults apps to 60 Hz to save battery; this package
  #     queries the supported display modes and lets us pick the
  #     highest-rate one matching the panel's native resolution.
  #     iOS ProMotion is handled separately via Info.plist
  #     `CADisableMinimumFrameDurationOnPhone = true`.
  flutter_displaymode: ^0.6.0
  google_fonts: ^8.1.0

dev_dependencies:
  sentry_dart_plugin: ^3.3.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.8
  fake_cloud_firestore: ^4.1.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
    - assets/icons/google/
    - assets/icons/hc/
    - assets/icons/kt/
    - assets/ui/
    - assets/ui/dashboard/cards/
    - assets/ui/welcome/
    - assets/ui/quests/
    - assets/ui/quests/chapter/icon/
    - assets/ui/quests/chapter/bg/
    - assets/map/
    - assets/cosmetics/frames/
    - assets/cosmetics/relics/
    - assets/cosmetics/backgrounds/
    - assets/cosmetics/banners/
    - assets/cosmetics/emblems/
    - assets/cosmetics/companions/
    - assets/cosmetics/skins/human_male/
    - assets/cosmetics/skins/human_female/
    - assets/cosmetics/skins/elf_male/
    - assets/cosmetics/skins/elf_female/
    - assets/cosmetics/skins/dwarf_male/
    - assets/cosmetics/skins/dwarf_female/
    - assets/cosmetics/skins/orc/
    - assets/cosmetics/skins/spirit/
    - assets/cosmetics/skins/golem/

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: flutter
  org: knejp
