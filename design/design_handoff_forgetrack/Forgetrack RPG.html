<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgetrack RPG Redesign</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { width: 100%; height: 100%; }
    body { background: #07090f; overflow: hidden; }
    #root { display: flex; align-items: center; justify-content: center; }

    @keyframes rpg-card-in  { from { opacity:0; transform:translateY(8px) } to { opacity:1; transform:translateY(0) } }
    @keyframes rpg-glow     { 0%,100% { box-shadow:0 0 14px rgba(124,111,255,.4),0 0 0 1px rgba(124,111,255,.2) } 50% { box-shadow:0 0 26px rgba(124,111,255,.65),0 0 0 1px rgba(124,111,255,.35) } }
    @keyframes rpg-spark    { 0%,100% { opacity:.5; transform:scale(1) } 50% { opacity:1; transform:scale(1.35) } }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(124,111,255,0.25); border-radius: 2px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="rpg-assets.jsx"></script>
  <script type="text/babel" src="rpg-ui.jsx"></script>
  <script type="text/babel">

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "accentColor": "#7C6FFF",
      "goldColor": "#FBBF24",
      "showSparkles": true
    }/*EDITMODE-END*/;

    function DeviceFrame({ children }) {
      const W = 393, H = 852;
      // Scale to fit viewport with padding
      const vw = window.innerWidth, vh = window.innerHeight;
      const scale = Math.min((vw - 32) / W, (vh - 32) / H, 1);

      return (
        <div style={{ width: W, height: H, transform: `scale(${scale})`, transformOrigin: 'center center' }}>
          <div style={{
            width: W, height: H, borderRadius: 50, overflow: 'hidden',
            background: '#000',
            boxShadow: '0 0 0 1px rgba(255,255,255,0.1), 0 40px 80px rgba(0,0,0,0.7), 0 0 0 10px #111, 0 0 0 11px rgba(255,255,255,0.06)',
            position: 'relative',
          }}>
            {/* Dynamic island */}
            <div style={{
              position: 'absolute', top: 12, left: '50%', transform: 'translateX(-50%)',
              width: 120, height: 34, borderRadius: 22, background: '#000', zIndex: 50,
              boxShadow: '0 0 0 1px rgba(255,255,255,0.07)',
            }}/>
            {/* Status bar */}
            <div style={{
              position: 'absolute', top: 0, left: 0, right: 0, height: 54, zIndex: 40,
              display: 'flex', alignItems: 'center', justifyContent: 'space-between',
              padding: '16px 28px 0', pointerEvents: 'none',
            }}>
              <span style={{ fontSize: 15, fontWeight: 600, color: '#fff', fontFamily: '-apple-system,sans-serif', letterSpacing: '-0.02em' }}>9:41</span>
              <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                <svg width="17" height="11" viewBox="0 0 17 11"><rect x="0" y="6" width="3" height="5" rx=".6" fill="rgba(255,255,255,0.55)"/><rect x="4.5" y="4" width="3" height="7" rx=".6" fill="rgba(255,255,255,0.55)"/><rect x="9" y="2" width="3" height="9" rx=".6" fill="#fff"/><rect x="13.5" y="0" width="3" height="11" rx=".6" fill="#fff"/></svg>
                <svg width="16" height="11" viewBox="0 0 16 11"><path d="M8 3C10 3 11.8 3.8 13.1 5.1L14 4.2C12.4 2.6 10.3 1.5 8 1.5S3.6 2.6 2 4.2l.9.9C4.2 3.8 6 3 8 3z" fill="#fff"/><path d="M8 6.5c1 0 1.9.4 2.5 1L11.4 6.6C10.5 5.7 9.3 5.1 8 5.1S5.5 5.7 4.6 6.6l.9.9C6.1 6.9 7 6.5 8 6.5z" fill="#fff"/><circle cx="8" cy="9.5" r="1.5" fill="#fff"/></svg>
                <svg width="25" height="12" viewBox="0 0 25 12"><rect x=".5" y=".5" width="21" height="11" rx="3.5" stroke="rgba(255,255,255,0.35)" fill="none"/><rect x="2" y="2" width="16" height="8" rx="2" fill="#fff"/><path d="M23 4.5v3c.7-.3 1.2-1 1.2-1.5s-.5-1.2-1.2-1.5z" fill="rgba(255,255,255,0.4)"/></svg>
              </div>
            </div>
            {/* App content */}
            <div style={{ position: 'absolute', inset: 0, paddingTop: 54, display: 'flex', flexDirection: 'column' }}>
              <RPGApp/>
            </div>
            {/* Home indicator */}
            <div style={{
              position: 'absolute', bottom: 8, left: '50%', transform: 'translateX(-50%)',
              width: 134, height: 5, borderRadius: 100, background: 'rgba(255,255,255,0.55)', zIndex: 50, pointerEvents: 'none',
            }}/>
          </div>
        </div>
      );
    }

    function TweaksPanel({ open }) {
      if (!open) return null;
      return (
        <div style={{
          position: 'fixed', bottom: 24, right: 24, zIndex: 9999,
          background: '#0D0F1C', border: '1px solid rgba(124,111,255,0.3)',
          borderRadius: 16, padding: '16px', width: 220,
          boxShadow: '0 8px 32px rgba(0,0,0,0.6)',
          fontFamily: 'Inter, sans-serif',
        }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: '#7C6FFF', textTransform: 'uppercase', letterSpacing: '.1em', marginBottom: 14 }}>Tweaks</div>
          <div style={{ fontSize: 11, color: 'rgba(255,255,255,0.4)', lineHeight: 1.6 }}>
            Navigate screens using the tab bar at the bottom of the phone.<br/><br/>
            Tap any tab — Home, Quests, Hero, Glory — to explore all 4 screens.
          </div>
          <div style={{ height: 1, background: 'rgba(255,255,255,0.08)', margin: '12px 0' }}/>
          <div style={{ fontSize: 10, color: 'rgba(255,255,255,0.25)', lineHeight: 1.5 }}>
            Visual style: Progression UI Redesign<br/>UX: Hero's Guild RPG
          </div>
        </div>
      );
    }

    function App() {
      const [tweaksOpen, setTweaksOpen] = React.useState(false);

      React.useEffect(() => {
        const h = (e) => {
          if (e.data?.type === '__activate_edit_mode')   setTweaksOpen(true);
          if (e.data?.type === '__deactivate_edit_mode') setTweaksOpen(false);
        };
        window.addEventListener('message', h);
        window.parent.postMessage({ type: '__edit_mode_available' }, '*');
        return () => window.removeEventListener('message', h);
      }, []);

      return (
        <>
          <DeviceFrame><RPGApp/></DeviceFrame>
          <TweaksPanel open={tweaksOpen}/>
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>
</body>
</html>
