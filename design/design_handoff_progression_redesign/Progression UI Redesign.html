<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Forgetrack · Progression UI Redesign</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#050710;display:flex;align-items:flex-start;justify-content:center;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;padding:24px 16px 40px}
::-webkit-scrollbar{display:none}

@keyframes card-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes expand-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
@keyframes spark{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
@keyframes glow-pulse{0%,100%{box-shadow:0 0 14px rgba(124,111,255,.4),0 0 0 1px rgba(124,111,255,.2)}50%{box-shadow:0 0 26px rgba(124,111,255,.65),0 0 0 1px rgba(124,111,255,.35)}}
@keyframes slide-right{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slide-left{from{transform:translateX(-100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes badge-pop{0%{transform:scale(.75);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes bar-fill{from{width:0}to{width:var(--w)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

.skel{background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.04) 75%);background-size:200% 100%;animation:shimmer 1.6s ease-in-out infinite;border-radius:8px}

/* tweaks panel */
#tp{position:fixed;bottom:20px;right:20px;background:rgba(15,17,35,.97);border:1px solid rgba(124,111,255,.3);border-radius:16px;padding:14px;width:210px;display:none;z-index:999;box-shadow:0 8px 32px rgba(0,0,0,.6)}
#tp.on{display:block}
#tp h4{font-size:10px;font-weight:700;color:#7C6FFF;text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px}
.tr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.tr label{font-size:11px;color:rgba(255,255,255,.55);font-weight:500}
.tog{width:34px;height:18px;border-radius:9px;border:none;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0}
.tog.on{background:#7C6FFF}.tog.off{background:rgba(255,255,255,.1)}
.tog::after{content:'';position:absolute;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .2s}
.tog.on::after{left:18px}.tog.off::after{left:2px}
</style>
</head>
<body>
<div id="root"></div>
<div id="tp">
  <h4>Tweaks</h4>
  <div class="tr"><label>Glow efekty</label><button class="tog on" id="tw-glow"></button></div>
  <div class="tr"><label>Sparkles</label><button class="tog on" id="tw-sparkles"></button></div>
  <div class="tr"><label>Card rozbalena</label><button class="tog off" id="tw-expanded"></button></div>
  <div class="tr"><label>Loading state</label><button class="tog off" id="tw-loading"></button></div>
</div>

<script type="text/babel">

// ─── TOKENS ──────────────────────────────────────────────────────────────────
const C = {
  bg:       '#0D0F1C',
  surface:  'rgba(255,255,255,0.03)',
  border:   'rgba(255,255,255,0.07)',
  accent:   '#7C6FFF',
  accentDim:'rgba(124,111,255,0.18)',
  accentGlow:'rgba(124,111,255,0.35)',
  teal:     '#2DD4BF', tealDim:'rgba(45,212,191,0.18)',  tealGlow:'rgba(45,212,191,0.25)',
  amber:    '#FBBF24', amberDim:'rgba(251,191,36,0.18)', amberGlow:'rgba(251,191,36,0.25)',
  green:    '#34D399', greenDim:'rgba(52,211,153,0.18)', greenGlow:'rgba(52,211,153,0.25)',
  violet:   '#A89BFF',
  t1:'rgba(255,255,255,0.95)',
  t2:'rgba(255,255,255,0.6)',
  t3:'rgba(255,255,255,0.35)',
  t4:'rgba(255,255,255,0.2)',
};

const DOMAINS = {
  steps:    {color:'#34D399',dim:'rgba(52,211,153,0.18)',glow:'rgba(52,211,153,0.25)',label:'Kroky'},
  nutrition:{color:'#FBBF24',dim:'rgba(251,191,36,0.18)',glow:'rgba(251,191,36,0.25)',label:'Výživa'},
  sleep:    {color:'#A89BFF',dim:'rgba(168,155,255,0.18)',glow:'rgba(168,155,255,0.25)',label:'Spánek'},
  activity: {color:'#2DD4BF',dim:'rgba(45,212,191,0.18)',glow:'rgba(45,212,191,0.25)',label:'Aktivita'},
  xp:       {color:'#7C6FFF',dim:'rgba(124,111,255,0.18)',glow:'rgba(124,111,255,0.25)',label:'XP'},
};

const PLAYER = {
  name:'Tomáš Knejp', title:'Forge Knight', level:16,
  totalXP:3870, xpIn:120, xpMax:250,
  streak:5, bestStreak:12, streakDomain:'Aktivita', bestStreakDomain:'Kroky',
  achievements:5, questsDone:6,
};

const ACTIVE_QUESTS = [
  {title:'Krok za krokem', desc:'50 000 kroků za týden', domain:'steps', current:31200, target:50000, progress:.624},
  {title:'Výživový rytmus', desc:'10 odměn za výživu', domain:'nutrition', current:7, target:10, progress:.7},
];

const COMP_QUESTS = [
  {title:'Získej první odměnu', source:'Podle počtu odměn', domain:'xp', at:'21 dub · 22:19'},
  {title:'Rytmus výživy', source:'Podle odměn: Výživa', domain:'nutrition', at:'21 dub · 22:19'},
  {title:'Dosáhni 500 XP', source:'Podle celkového XP', domain:'xp', at:'21 dub · 22:19'},
  {title:'Týdenní aktivita', source:'Podle: Týdenní aktivita', domain:'activity', at:'21 dub · 22:19'},
  {title:'Série kroků', source:'Podle série: Denní kroky', domain:'steps', at:'3 dub · 00:00'},
];

const ACHIEV_UNLOCKED = [
  {title:'Vyvážený rytmus', desc:'Výživa 3 dny v řadě', domain:'nutrition', p:6, t:3, at:'26 bře'},
  {title:'Řetěz kroků', desc:'Kroky 3 dny v řadě', domain:'steps', p:17, t:3, at:'3 dub'},
  {title:'První odměna', desc:'První progression odměna', domain:'xp', p:55, t:1, at:'21 dub'},
  {title:'Stopař', desc:'Dosáhni levelu 5 XP', domain:'xp', p:3870, t:1000, at:'21 dub'},
  {title:'Týdenní válečník', desc:'Týdenní cíl aktivity', domain:'activity', p:5, t:1, at:'21 dub'},
];

const ACHIEV_PROGRESS = [
  {title:'Měsíční maratón', desc:'30 dní kroků v řadě', domain:'steps', p:5, t:30},
  {title:'Spánkový mistr', desc:'Skóre 90+ po 7 nocí', domain:'sleep', p:2, t:7},
  {title:'Kalorický rytmus', desc:'14 dní kalorický cíl', domain:'nutrition', p:4, t:14},
];

const HISTORY = [
  {title:'Denní kroky',    domain:'steps',     xp:80,  ts:'21 dub · 22:35'},
  {title:'Kalorický cíl',  domain:'nutrition', xp:60,  ts:'21 dub · 22:19'},
  {title:'Týdenní aktivita',domain:'activity', xp:120, ts:'21 dub · 22:19'},
  {title:'Denní kroky',    domain:'steps',     xp:80,  ts:'21 dub · 22:19'},
  {title:'Kalorický cíl',  domain:'nutrition', xp:60,  ts:'21 dub · 22:19'},
  {title:'Dobrý spánek',   domain:'sleep',     xp:40,  ts:'20 dub · 08:10'},
];

// ─── PRIMITIVES ───────────────────────────────────────────────────────────────
function PBar({value, color, glow, h=5}){
  const pct = Math.min(1,Math.max(0,value))*100;
  return (
    <div style={{height:h,borderRadius:99,background:'rgba(255,255,255,0.08)',overflow:'hidden'}}>
      <div style={{height:'100%',width:`${pct}%`,borderRadius:99,
        background:`linear-gradient(90deg,${color},${color}cc)`,
        boxShadow:`0 0 8px ${glow}`,transition:'width .6s cubic-bezier(.4,0,.2,1)'}}/>
    </div>
  );
}

function StarIco({color='#7C6FFF',size=9}){
  return <svg width={size} height={size} viewBox="0 0 10 10"><path d="M5 0L5.8 4.2 10 5 5.8 5.8 5 10 4.2 5.8 0 5 4.2 4.2 5 0z" fill={color}/></svg>;
}

function SectionHead({label, sub, color='#7C6FFF'}){
  return (
    <div style={{display:'flex',alignItems:'center',gap:7,padding:'2px 0'}}>
      <StarIco color={color}/>
      <div>
        <div style={{fontSize:11,fontWeight:700,color,textTransform:'uppercase',letterSpacing:'.1em',lineHeight:1}}>{label}</div>
        {sub && <div style={{fontSize:10,color:C.t3,fontWeight:500,marginTop:2}}>{sub}</div>}
      </div>
    </div>
  );
}

function DomIco({domain, size=30}){
  const d = DOMAINS[domain]||DOMAINS.xp;
  // simple SVG icons per domain
  const icons = {
    steps:    <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M5 13l2.5-11 2.5 11" stroke={d.color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/><path d="M2.5 9h10" stroke={d.color} strokeWidth="1.8" strokeLinecap="round"/></svg>,
    nutrition:<svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M4.5 2c0 2.2-2.2 2.8-2.2 5a5.2 5.2 0 0010.4 0C12.7 4.8 10.5 4.2 10.5 2" stroke={d.color} strokeWidth="1.6" strokeLinecap="round" fill="none"/><path d="M7.5 7v3" stroke={d.color} strokeWidth="1.6" strokeLinecap="round"/></svg>,
    sleep:    <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M10 2.5a6 6 0 01-7 7A6 6 0 1010 2.5z" fill={d.color} opacity=".9"/></svg>,
    activity: <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M1 7.5h2l2-4.5 3 9 2-4.5h4" stroke={d.color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
    xp:       <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M7.5 1l1.6 4 4.2.4-3.1 2.8.9 4.2L7.5 10l-3.6 2.4.9-4.2L1.7 5.4l4.2-.4z" fill={d.color}/></svg>,
  };
  return (
    <div style={{width:size,height:size,borderRadius:size*.3,background:d.dim,
      border:`1px solid ${d.color}44`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
      {icons[domain]||icons.xp}
    </div>
  );
}

function Skeleton({w, h=12, style={}}){
  return <div className="skel" style={{width:w,height:h,...style}}/>;
}

// ─── HOME SCREEN ─────────────────────────────────────────────────────────────

// Compact progression card header (always visible)
function CardCompact({tweaks}){
  return (
    <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
      {/* level orb */}
      <div style={{
        width:36,height:36,borderRadius:11,flexShrink:0,
        background:`linear-gradient(135deg,${C.accent},${C.accent}88)`,
        border:`1.5px solid ${C.accent}66`,
        display:'flex',alignItems:'center',justifyContent:'center',
        fontSize:14,fontWeight:900,color:'#fff',
        animation: tweaks.glow ? 'glow-pulse 3s ease-in-out infinite' : 'none',
        boxShadow: tweaks.glow ? `0 0 14px ${C.accentGlow}` : 'none',
      }}>{PLAYER.level}</div>

      <div style={{flex:1,minWidth:0}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:4}}>
          <span style={{fontSize:10,fontWeight:700,color:C.accent,textTransform:'uppercase',letterSpacing:'.07em'}}>
            Level {PLAYER.level} · {PLAYER.title}
          </span>
          <span style={{fontSize:10,color:C.t3,fontWeight:500,fontVariantNumeric:'tabular-nums'}}>
            {PLAYER.xpIn} / {PLAYER.xpMax} XP
          </span>
        </div>
        <PBar value={PLAYER.xpIn/PLAYER.xpMax} color={C.accent} glow={C.accentGlow} h={5}/>
      </div>
    </div>
  );
}

// Highlight pills below bar (compact state only)
function CardHighlights(){
  return (
    <div style={{display:'flex',gap:6}}>
      <div style={{display:'flex',alignItems:'center',gap:5,background:C.tealDim,
        border:`1px solid ${C.teal}33`,borderRadius:99,padding:'4px 10px 4px 7px'}}>
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <path d="M6 1l1.2 3.2 3.2.3-2.4 2.1.7 3.4L6 8.5l-2.7 1.5.7-3.4L1.6 4.5l3.2-.3z" fill={C.teal}/>
        </svg>
        <span style={{fontSize:11,fontWeight:700,color:C.teal}}>{PLAYER.streak}</span>
        <span style={{fontSize:10,fontWeight:500,color:'rgba(45,212,191,0.6)'}}>série · {PLAYER.streakDomain}</span>
      </div>
      <div style={{display:'flex',alignItems:'center',gap:5,background:C.accentDim,
        border:`1px solid ${C.accent}33`,borderRadius:99,padding:'4px 10px 4px 7px'}}>
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <circle cx="6" cy="6" r="4" stroke={C.accent} strokeWidth="1.4" fill="none"/>
          <circle cx="6" cy="6" r="1.8" fill={C.accent}/>
        </svg>
        <span style={{fontSize:11,fontWeight:700,color:C.accent}}>{PLAYER.achievements}</span>
        <span style={{fontSize:10,fontWeight:500,color:'rgba(124,111,255,0.6)'}}>úspěchů</span>
      </div>
    </div>
  );
}

// Stat mini cell for expanded grid
function MiniStat({icon, label, value, unit, color, delay=0}){
  return (
    <div style={{flex:1,borderRadius:12,padding:'11px 10px',background:'rgba(255,255,255,0.04)',
      border:'1px solid rgba(255,255,255,0.07)',animation:`expand-in .28s ease ${delay}s both`}}>
      <div style={{marginBottom:6}}>{icon}</div>
      <div style={{fontSize:18,fontWeight:900,color,letterSpacing:'-0.03em',lineHeight:1,fontVariantNumeric:'tabular-nums'}}>
        {value}{unit && <span style={{fontSize:10,fontWeight:600,color:C.t3,marginLeft:2}}>{unit}</span>}
      </div>
      <div style={{fontSize:9,fontWeight:600,color:C.t4,textTransform:'uppercase',letterSpacing:'.07em',marginTop:3}}>{label}</div>
    </div>
  );
}

// Streak duel row
function StreakDuel({tweaks}){
  const pill = (label, value, domain, color, dim, glow, delay) => (
    <div style={{flex:1,borderRadius:12,padding:'11px 12px',
      background:`linear-gradient(135deg,${dim},transparent)`,
      border:`1px solid ${color}28`,
      boxShadow: tweaks.glow ? `0 2px 14px ${glow}` : 'none',
      animation:`expand-in .28s ease ${delay}s both`}}>
      <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:6}}>
        <DomIco domain={domain} size={24}/>
        <span style={{fontSize:9,fontWeight:700,color,textTransform:'uppercase',letterSpacing:'.08em'}}>{label}</span>
      </div>
      <div style={{fontSize:24,fontWeight:900,color,letterSpacing:'-0.04em',lineHeight:1}}>
        {value}<span style={{fontSize:11,fontWeight:600,color:`${color}88`,marginLeft:3}}>dní</span>
      </div>
      <div style={{fontSize:9,color:`${color}70`,fontWeight:500,marginTop:3,textTransform:'uppercase',letterSpacing:'.06em'}}>
        {domain === 'activity' ? PLAYER.streakDomain : PLAYER.bestStreakDomain}
      </div>
    </div>
  );
  return (
    <div style={{display:'flex',gap:8}}>
      {pill('Aktuální série', PLAYER.streak,     'activity', C.teal,  C.tealDim,  C.tealGlow,  0.04)}
      {pill('Nejlepší série', PLAYER.bestStreak, 'steps',    C.amber, C.amberDim, C.amberGlow, 0.08)}
    </div>
  );
}

// Mini quest preview row in home card
function MiniQuestRow({q, isLast}){
  const d = DOMAINS[q.domain]||DOMAINS.xp;
  return (
    <div style={{display:'flex',alignItems:'center',gap:9,padding:'8px 0',
      borderBottom: isLast ? 'none' : '1px solid rgba(255,255,255,0.06)'}}>
      <DomIco domain={q.domain} size={26}/>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:12,fontWeight:700,color:C.t1,letterSpacing:'-0.01em',
          whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{q.title}</div>
        <div style={{marginTop:4}}>
          <PBar value={q.progress} color={d.color} glow={d.glow} h={3}/>
        </div>
      </div>
      <div style={{fontSize:10,fontWeight:700,color:d.color,flexShrink:0,fontVariantNumeric:'tabular-nums'}}>
        {Math.round(q.progress*100)}%
      </div>
    </div>
  );
}

// Expanded section of the card
function CardExpanded({tweaks, onOpen}){
  return (
    <div style={{borderTop:'1px solid rgba(255,255,255,0.08)',marginTop:12,paddingTop:12,
      display:'flex',flexDirection:'column',gap:10}}>

      {/* 2×2 stat grid */}
      <div style={{display:'flex',gap:6}}>
        <MiniStat
          icon={<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 1l1.8 4 4.2.4-3.1 2.8.9 4.3L8 10.2 4.2 12.5l.9-4.3L1.8 5.4l4.2-.4z" fill={C.accent}/></svg>}
          label="Celkem XP" value="3,87" unit="tis." color={C.accent} delay={0}/>
        <MiniStat
          icon={<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M10 5l3 3-3 3" stroke={C.violet} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>}
          label="Do dalšího" value={PLAYER.xpMax - PLAYER.xpIn} unit="XP" color={C.violet} delay={0.04}/>
        <MiniStat
          icon={<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="5.5" stroke={C.accent} strokeWidth="1.5" fill="none"/><circle cx="8" cy="8" r="2.5" fill={C.accent}/></svg>}
          label="Úspěchy" value={PLAYER.achievements} color={C.accent} delay={0.08}/>
        <MiniStat
          icon={<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8l3.5 3.5L13 4" stroke={C.green} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>}
          label="Questy" value={PLAYER.questsDone} color={C.green} delay={0.12}/>
      </div>

      {/* streak duel */}
      <StreakDuel tweaks={tweaks}/>

      {/* active quests preview */}
      {ACTIVE_QUESTS.length > 0 && (
        <div style={{borderRadius:12,background:'rgba(0,0,0,0.2)',border:'1px solid rgba(255,255,255,0.05)',
          padding:'4px 10px 2px',animation:'expand-in .28s ease .16s both'}}>
          <div style={{fontSize:9,fontWeight:700,color:C.t4,textTransform:'uppercase',
            letterSpacing:'.1em',padding:'6px 0 4px'}}>Aktivní questy</div>
          {ACTIVE_QUESTS.map((q,i)=>(
            <MiniQuestRow key={i} q={q} isLast={i===ACTIVE_QUESTS.length-1}/>
          ))}
        </div>
      )}

      {/* CTA */}
      <button onClick={onOpen} style={{
        width:'100%',height:42,borderRadius:12,border:'none',cursor:'pointer',
        background:`linear-gradient(135deg, ${C.accent}cc, ${C.accent}88)`,
        boxShadow: tweaks.glow ? `0 4px 18px ${C.accentGlow}` : 'none',
        color:'#fff',fontSize:13,fontWeight:700,fontFamily:'Inter,sans-serif',
        display:'flex',alignItems:'center',justifyContent:'center',gap:6,
        animation:'expand-in .28s ease .2s both',
        transition:'filter .15s',
      }}>
        <span>Otevřít progression profil</span>
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M1 7h12M8 3l4 4-4 4" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      </button>
    </div>
  );
}

// Loading skeleton state for card
function CardSkeleton(){
  return (
    <div style={{display:'flex',flexDirection:'column',gap:10}}>
      <div style={{display:'flex',alignItems:'center',gap:10}}>
        <div className="skel" style={{width:36,height:36,borderRadius:11}}/>
        <div style={{flex:1,display:'flex',flexDirection:'column',gap:5}}>
          <Skeleton w="50%" h={10}/>
          <Skeleton w="100%" h={5} style={{borderRadius:99}}/>
        </div>
      </div>
      <div style={{display:'flex',gap:6}}>
        <Skeleton w="40%" h={24} style={{borderRadius:99}}/>
        <Skeleton w="40%" h={24} style={{borderRadius:99}}/>
      </div>
    </div>
  );
}

// The full progression card
function ProgressionCard({tweaks, onOpen}){
  const [open, setOpen] = React.useState(tweaks.expanded);

  React.useEffect(()=>{ setOpen(tweaks.expanded); }, [tweaks.expanded]);

  if(tweaks.loading) return (
    <div style={{borderRadius:18,background:`linear-gradient(135deg,${C.accentDim},rgba(124,111,255,0.04))`,
      border:`1px solid ${C.accent}22`,padding:'14px 14px 14px'}}>
      <CardSkeleton/>
    </div>
  );

  return (
    <div style={{borderRadius:18,

// ─── APP ROOT ─────────────────────────────────────────────────────────────────

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "glow": true,
  "sparkles": true,
  "expanded": false,
  "loading": false
}/*EDITMODE-END*/;

function App(){
  const saved = (() => { try { return JSON.parse(localStorage.getItem('ft_ui_tweaks')||'{}'); } catch(e){ return {}; } })();
  const [tw, setTw] = React.useState({...TWEAK_DEFAULTS,...saved});
  const [screen, setScreen] = React.useState('home'); // 'home' | 'profile'
  const [editMode, setEditMode] = React.useState(false);

  React.useEffect(()=>{ localStorage.setItem('ft_ui_tweaks', JSON.stringify(tw)); }, [tw]);

  React.useEffect(()=>{
    const h = (e)=>{
      if(e.data?.type==='__activate_edit_mode') setEditMode(true);
      if(e.data?.type==='__deactivate_edit_mode') setEditMode(false);
    };
    window.addEventListener('message',h);
    window.parent.postMessage({type:'__edit_mode_available'},'*');
    return ()=>window.removeEventListener('message',h);
  },[]);

  // sync tweaks panel buttons
  React.useEffect(()=>{
    const defs = [{id:'tw-glow',k:'glow'},{id:'tw-sparkles',k:'sparkles'},{id:'tw-expanded',k:'expanded'},{id:'tw-loading',k:'loading'}];
    defs.forEach(({id,k})=>{
      const btn = document.getElementById(id);
      if(!btn) return;
      btn.className = 'tog '+(tw[k]?'on':'off');
      btn.onclick = ()=>{ setTw(p=>({...p,[k]:!p[k]})); };
    });
    const panel = document.getElementById('tp');
    if(panel) panel.className = editMode ? 'on' : '';
  });

  const containerStyle = {
    display:'flex', gap:32, alignItems:'flex-start', flexWrap:'wrap', justifyContent:'center',
  };

  return (
    <div>
      <div style={containerStyle}>
        <DeviceFrame label="Home · Progression Card">
          <HomeScreen tweaks={tw} onOpenProfile={()=>setScreen('profile')}/>
        </DeviceFrame>
        <DeviceFrame label="Progression Profile">
          <ProfileScreen tweaks={tw} onBack={()=>setScreen('home')}/>
        </DeviceFrame>
      </div>
      <div style={{textAlign:'center',marginTop:20,fontSize:11,color:'rgba(255,255,255,0.18)',fontFamily:'Inter,sans-serif',fontWeight:500}}>
        Forgetrack · Progression UI Redesign · tap card to expand · use Tweaks to explore
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
