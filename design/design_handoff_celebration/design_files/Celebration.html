<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8"/>
<title>Celebration · Forgetrack</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<style>
  html,body{margin:0;padding:0;background:#f0eee9;font-family:-apple-system,BlinkMacSystemFont,"Inter","SF Pro Text",system-ui,sans-serif;}
  *{box-sizing:border-box}

  /* Animations used across all celebration variants */
  @keyframes celEnter {
    from { opacity: 0; transform: translateY(16px) scale(0.94); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes celRise2 {
    from { opacity: 0; transform: translateY(40px) scale(0.85); filter: blur(6px); }
    to   { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }
  @keyframes celTop {
    from { opacity: 0; transform: translateY(-30px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes celBreathe {
    0%,100% { opacity: 0.7; transform: scale(1); }
    50%     { opacity: 1;   transform: scale(1.06); }
  }
  @keyframes celPulse {
    0%,100% { transform: scale(1); }
    50%     { transform: scale(1.04); }
  }
  @keyframes celShine {
    0%,15%   { transform: translateX(-220%) rotate(20deg); }
    50%,100% { transform: translateX(420%) rotate(20deg); }
  }
  @keyframes celShimmer {
    0%,100% { transform: translateX(-30%); opacity: 0.3; }
    50%     { transform: translateX(30%); opacity: 0.9; }
  }
  @keyframes celRotate {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  @keyframes celRise {
    0%   { opacity: 0; transform: translateY(0) translateX(0); }
    10%  { opacity: 0.9; }
    90%  { opacity: 0.9; }
    100% { opacity: 0; transform: translateY(-560px) translateX(var(--drift, 0)); }
  }
  @keyframes celClaimPulse {
    0%,100% { box-shadow: 0 8px 24px -8px rgba(244,193,82,0.7), inset 0 1px 0 rgba(255,255,255,0.45), inset 0 -2px 0 rgba(0,0,0,0.12), 0 0 0 0 rgba(244,193,82,0.55); }
    50%     { box-shadow: 0 8px 24px -8px rgba(244,193,82,0.9), inset 0 1px 0 rgba(255,255,255,0.45), inset 0 -2px 0 rgba(0,0,0,0.12), 0 0 0 8px rgba(244,193,82,0); }
  }
  @keyframes celBadgePop {
    0%   { transform: scale(0.6) rotate(-8deg); opacity: 0; }
    60%  { transform: scale(1.08) rotate(2deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  @keyframes celBurst {
    0%   { opacity: 0; transform: translate(0,0) rotate(0); }
    8%   { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--tx), calc(var(--ty) + 200px)) rotate(var(--rot)); }
  }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="celebration-tokens.jsx"></script>
<script type="text/babel" src="celebration-icons.jsx"></script>
<script type="text/babel" src="celebration-fx.jsx"></script>
<script type="text/babel" src="celebration-variants.jsx"></script>
<script type="text/babel" src="celebration-app.jsx"></script>
</body>
</html>
