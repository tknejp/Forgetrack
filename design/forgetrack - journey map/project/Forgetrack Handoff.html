<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Forgetrack – Flutter Design Handoff</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; background: #0A0B14; font-family: 'Inter', sans-serif; color: #fff; }
  #root { min-height: 100vh; }

  .doc-scroll::-webkit-scrollbar { width: 4px; }
  .doc-scroll::-webkit-scrollbar-track { background: transparent; }
  .doc-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 99px; }

  #tweaks-panel { display:none; position:fixed; bottom:24px; right:24px; background:#1A1C2E; border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:20px; width:260px; z-index:9999; box-shadow:0 20px 60px rgba(0,0,0,0.6); }
  #tweaks-panel.open { display:block; }
  .tw-title { font-size:13px; font-weight:700; color:rgba(255,255,255,0.5); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:16px; }
  .tw-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .tw-label { font-size:13px; color:rgba(255,255,255,0.75); }
  .tw-select { background:#0D0F1C; border:1px solid rgba(255,255,255,0.15); color:#fff; border-radius:8px; padding:4px 8px; font-size:12px; font-family:'Inter',sans-serif; }
  .tw-tog { width:40px; height:22px; background:rgba(255,255,255,0.15); border-radius:99px; cursor:pointer; position:relative; transition:background 0.2s; flex-shrink:0; }
  .tw-tog.on { background:#7C6FFF; }
  .tw-tog::after { content:''; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:#fff; transition:transform 0.2s; }
  .tw-tog.on::after { transform:translateX(18px); }
</style>
</head>
<body>
<div id="root"></div>
<div id="tweaks-panel">
  <div class="tw-title">Tweaks</div>
  <div class="tw-row"><span class="tw-label">Color theme</span>
    <select class="tw-select" id="tw-theme">
      <option value="violet">Violet</option>
      <option value="cyan">Cyan</option>
      <option value="rose">Rose</option>
    </select>
  </div>
  <div class="tw-row"><span class="tw-label">Card glow</span><div class="tw-tog on" id="tw-glow"></div></div>
  <div class="tw-row"><span class="tw-label">Sparkles</span><div class="tw-tog on" id="tw-sparkles"></div></div>
  <div class="tw-row"><span class="tw-label">Compact cards</span><div class="tw-tog on" id="tw-compact"></div></div>
  <div class="tw-row"><span class="tw-label">Doc panel</span><div class="tw-tog on" id="tw-doc"></div></div>
</div>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="ft-tokens.jsx"></script>
<script type="text/babel" src="ft-components.jsx"></script>
<script type="text/babel" src="ft-screens.jsx"></script>

<script type="text/babel">

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "violet",
  "glow": true,
  "sparkles": true,
  "compact": false,
  "doc": true

// ── Handoff doc data (per-screen) ───────────────────────────────────────

      'Bottom nav: 24px safe area + 10px pad',
    ],
    flutter: [
      'AnimatedContainer on fill width, duration 600ms, Curves.easeOut',
      'Sparkles = List<AnimatedOpacity>(4) with staggered Tween delays',
      'Glow = BoxShadow(blurRadius:24, color:colorGlow) — no spread',
      'TabPill: use AnimatedAlign or AnimatedContainer to slide gradient',
      'Use ThemeExtension for DomainColor {color, dim, glow, gradient}',
      'Persist expanded state per-card in ValueNotifier or provider',
    ],
  },
  activities: {
    name: 'Activities',
    domain: 'active',
    subtitle: 'Weekly aggregates · trend chart · recent "quests"',

    ],

      { s:'Empty quests', desc:'Show centered 🧘 + "No quests today" muted — keep card chrome' },

// ── Doc panel ───────────────────────────────────────────────────────────
function DocPanel({ screenKey, theme }) {
  const [tab, setTab] = React.useState('layout');
  const doc = SCREENS_DOC[screenKey];
  if (!doc) return null;
  const d = DOMAINS[doc.domain];
  const c = d.color;

  const tabs = [['layout','Layout'],['components','Components'],['specs','Specs'],['flutter','Flutter']];

  const chip = (txt, color) => (
    <span style={{ fontSize:10, fontFamily:'JetBrains Mono, monospace', color: color||c, background:`${color||c}18`, border:`1px solid ${color||c}35`, borderRadius:5, padding:'2px 6px', flexShrink:0 }}>{txt}</span>
  );
  const label = (txt) => <div style={{ fontSize:10, fontWeight:700, color:'rgba(255,255,255,0.3)', textTransform:'uppercase', letterSpacing:'0.1em', marginBottom:8, marginTop:16 }}>{txt}</div>;

  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100%' }}>
      <div style={{ padding:'28px 24px 16px', borderBottom:'1px solid rgba(255,255,255,0.06)', flexShrink:0, display:'flex', gap:10, alignItems:'flex-start' }}>
        <svg width="14" height="14" viewBox="0 0 14 14" style={{ flexShrink:0, marginTop:5 }}><path d="M7 0L8.1 5.9 14 7 8.1 8.1 7 14 5.9 8.1 0 7 5.9 5.9 7 0z" fill={c}/></svg>
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ fontSize:16, fontWeight:800, color:'#fff', letterSpacing:'-0.02em', marginBottom:4 }}>{doc.name}</div>
          <div style={{ fontSize:11, color:'rgba(255,255,255,0.4)', lineHeight:1.4 }}>{doc.subtitle}</div>
        </div>
      </div>

      <div style={{ display:'flex', padding:'10px 16px 0', gap:4, flexShrink:0, borderBottom:'1px solid rgba(255,255,255,0.06)' }}>
        {tabs.map(([k,lbl]) => (
          <button key={k} onClick={() => setTab(k)} style={{
            padding:'6px 12px 10px', border:'none', background:'transparent', cursor:'pointer',
            fontSize:12, fontWeight: k===tab?700:500,
            color: k===tab ? c : 'rgba(255,255,255,0.35)',
            borderBottom: k===tab ? `2px solid ${c}` : '2px solid transparent',
            transition:'all 0.15s', fontFamily:'Inter,sans-serif',
          }}>{lbl}</button>
        ))}
      </div>

      <div className="doc-scroll" style={{ flex:1, overflowY:'auto', padding:'4px 20px 32px' }}>

        {tab === 'layout' && <>
          {label('Screen layout tree')}
          <div style={{ fontFamily:'JetBrains Mono, monospace', fontSize:11, lineHeight:1.9, color:'rgba(255,255,255,0.65)' }}>
            {doc.layout.map((l,i) => {
              const indent = l.startsWith('    ') ? 2 : l.startsWith('  ') ? 1 : 0;
              return (
                <div key={i} style={{ paddingLeft: indent*14, color: indent===0 ? 'rgba(255,255,255,0.85)' : indent===1 ? 'rgba(255,255,255,0.6)' : 'rgba(255,255,255,0.45)' }}>
                  {indent>0 && <span style={{ color:`${c}70`, marginRight:4 }}>└</span>}
                  {l.trim()}
                </div>
              );
            })}
          </div>
        </>}

        {tab === 'components' && <>
          {label('Component inventory')}
          <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
            {doc.components.map((comp,i) => (
              <div key={i} style={{ background:'rgba(255,255,255,0.03)', border:'1px solid rgba(255,255,255,0.07)', borderRadius:10, padding:'10px 12px' }}>
                <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:4, flexWrap:'wrap' }}>
                  <span style={{ fontSize:13, fontWeight:700, color:'#fff' }}>{comp.name}</span>
                  {chip(comp.widget)}
                </div>
                <div style={{ fontSize:11, color:'rgba(255,255,255,0.45)', lineHeight:1.55 }}>{comp.note}</div>
              </div>
            ))}
          </div>
          {label('Component states')}
          <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
            {doc.states.map((st,i) => (
              <div key={i} style={{ display:'flex', gap:10, background:'rgba(255,255,255,0.02)', border:'1px solid rgba(255,255,255,0.06)', borderRadius:9, padding:'9px 12px' }}>
                {chip(st.s, st.s.match(/Over|Warning|Empty|Loading|No /) ? 'rgba(255,255,255,0.45)' : c)}
                <span style={{ fontSize:11, color:'rgba(255,255,255,0.55)', lineHeight:1.5 }}>{st.desc}</span>
              </div>
            ))}
          </div>
        </>}

        {tab === 'specs' && <>
          {label('Spacing & sizing')}
          <div style={{ display:'flex', flexDirection:'column', gap:5 }}>
            {doc.specs.map((s,i) => (
              <div key={i} style={{ display:'flex', alignItems:'baseline', gap:10, padding:'8px 10px', background:'rgba(255,255,255,0.02)', border:'1px solid rgba(255,255,255,0.05)', borderRadius:8 }}>
                <div style={{ width:5, height:5, borderRadius:'50%', background:c, flexShrink:0, marginTop:1 }}/>
                <span style={{ fontSize:11, fontFamily:'JetBrains Mono, monospace', color:'rgba(255,255,255,0.65)', lineHeight:1.5 }}>{s}</span>
              </div>
            ))}
          </div>
          {label('Domain color tokens')}
          <div style={{ display:'flex', flexWrap:'wrap', gap:6 }}>
            {Object.entries(DOMAINS).map(([k,v]) => (
              <div key={k} style={{ display:'flex', alignItems:'center', gap:6, background:'rgba(255,255,255,0.03)', border:'1px solid rgba(255,255,255,0.06)', borderRadius:8, padding:'6px 10px' }}>
                <div style={{ width:12, height:12, borderRadius:3, background:v.color, flexShrink:0, boxShadow:`0 0 6px ${v.glow}` }}/>
                <span style={{ fontSize:10, fontFamily:'JetBrains Mono, monospace', color:'rgba(255,255,255,0.6)' }}>{k}</span>
                <span style={{ fontSize:9, fontFamily:'JetBrains Mono, monospace', color:'rgba(255,255,255,0.3)' }}>{v.color}</span>
              </div>
            ))}
          </div>
          {label('Type scale')}
          <div style={{ display:'flex', flexDirection:'column', gap:8, background:'rgba(255,255,255,0.02)', border:'1px solid rgba(255,255,255,0.06)', borderRadius:10, padding:12 }}>
            {[
              ['Display','20/800','Dashboard'],
              ['Card value','22/800','7 235'],
              ['Card label','10/500 CAPS','CURRENT'],
              ['Body','13–15/500–700','Steps'],
              ['Caption','10/500','7 235 / 10 000'],
            ].map(([n,s,e]) => (
              <div key={n} style={{ display:'flex', alignItems:'baseline', gap:12 }}>
                <div style={{ width:80, fontSize:10, color:'rgba(255,255,255,0.3)', fontWeight:600, flexShrink:0 }}>{n}</div>
                <div style={{ fontSize:10, fontFamily:'JetBrains Mono, monospace', color:'rgba(255,255,255,0.25)', width:100, flexShrink:0 }}>{s}</div>
                <div style={{ fontSize:13, color:'rgba(255,255,255,0.75)', fontWeight:600 }}>{e}</div>
              </div>
            ))}
          </div>
        </>}

        {tab === 'flutter' && <>
          {label('Implementation notes')}
          <div style={{ display:'flex', flexDirection:'column', gap:7 }}>
            {doc.flutter.map((n,i) => (
              <div key={i} style={{ display:'flex', gap:10, background:'rgba(255,255,255,0.02)', border:'1px solid rgba(255,255,255,0.06)', borderRadius:9, padding:'10px 12px' }}>
                <span style={{ fontSize:11, fontWeight:800, color:c, flexShrink:0, width:18, textAlign:'right', fontFamily:'JetBrains Mono, monospace' }}>{String(i+1).padStart(2,'0')}</span>
                <span style={{ fontSize:11, color:'rgba(255,255,255,0.6)', lineHeight:1.65 }}>{n}</span>
              </div>
            ))}
          </div>
          {label('Reusable widget map')}
          <div style={{ fontFamily:'JetBrains Mono, monospace', fontSize:10, lineHeight:2, color:'rgba(255,255,255,0.5)', background:'rgba(255,255,255,0.02)', border:'1px solid rgba(255,255,255,0.06)', borderRadius:10, padding:'12px 14px' }}>
            {[
              'Scaffold',
              '├─ AppBar (custom — ScreenHeader)',
              '├─ body: SingleChildScrollView',
              '│  └─ Column',
              '│     ├─ TabPill (optional)',
              '│     ├─ XpBar (Overview only)',
              '│     ├─ StatCard · N',
              '│     └─ PlainCard · M (charts, lists, grids)',
              '└─ bottomNavigationBar: BottomNav',
            ].map((l,i) => (
              <div key={i} style={{ color: i===0?'#fff':i<4?'rgba(255,255,255,0.7)':'rgba(255,255,255,0.45)' }}>{l}</div>
            ))}
          </div>
        </>}
      </div>
    </div>
  );
}

// ── Root ────────────────────────────────────────────────────────────────
function Root() {
  const [screen, setScreen] = React.useState('overview');
  const [tweaks, setTweaks] = React.useState(TWEAK_DEFAULTS);
  const tweaksRef = React.useRef(tweaks);
  tweaksRef.current = tweaks;

  const theme = THEMES[tweaks.theme] || THEMES.violet;

  React.useEffect(() => {
    const panel = document.getElementById('tweaks-panel');
    const themeEl = document.getElementById('tw-theme');
    const glowEl = document.getElementById('tw-glow');
    const sparklesEl = document.getElementById('tw-sparkles');
    const compactEl = document.getElementById('tw-compact');
    const docEl = document.getElementById('tw-doc');

    themeEl.value = tweaksRef.current.theme;
    [[glowEl,'glow'],[sparklesEl,'sparkles'],[compactEl,'compact'],[docEl,'doc']].forEach(([el,k])=>{
      if (tweaksRef.current[k]) el.classList.add('on'); else el.classList.remove('on');
    });

    themeEl.addEventListener('change', e => {
      const v = e.target.value;
      setTweaks(t => ({ ...t, theme: v }));
      window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { theme: v } }, '*');
    });
    const tog = (el, key) => {
      el.addEventListener('click', () => {
        el.classList.toggle('on');
        const v = el.classList.contains('on');
        setTweaks(t => ({ ...t, [key]: v }));
        window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: v } }, '*');
      });
    };
    tog(glowEl, 'glow');
    tog(sparklesEl, 'sparkles');
    tog(compactEl, 'compact');
    tog(docEl, 'doc');

    window.addEventListener('message', e => {
      if (e.data?.type === '__activate_edit_mode') panel.classList.add('open');
      if (e.data?.type === '__deactivate_edit_mode') panel.classList.remove('open');
    });
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
  }, []);

  const screenMap = {
    overview: <OverviewScreen   tweaks={tweaks} theme={theme}/>,
    activities: <ActivitiesScreen tweaks={tweaks} theme={theme}/>,
    nutrition:  <NutritionScreen  tweaks={tweaks} theme={theme}/>,
    body:       <BodyScreen       tweaks={tweaks} theme={theme}/>,
  };

  const screenNav = [
    { id:'overview',   label:'Overview',   domain:'steps' },
    { id:'activities', label:'Activities', domain:'active' },
    { id:'nutrition',  label:'Nutrition',  domain:'calories' },
    { id:'body',       label:'Body',       domain:'weight' },
  ];

  return (
    <div style={{ display:'flex', width:'100%', minHeight:'100vh', alignItems:'flex-start', padding:'32px 28px 60px', gap:40, flexWrap:'wrap', justifyContent:'center' }} data-screen-label={`Handoff · ${screen}`}>
      <style>{`
        @keyframes ft-spark { 0%,100%{opacity:0; transform:scale(0.5)} 50%{opacity:1; transform:scale(1)} }
        @keyframes ft-card-in { from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)} }
        @keyframes ft-bar-grow { from{height:0 !important} }
      `}</style>

      {/* Left: phone + screen switcher */}
      <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:16, flexShrink:0 }}>
        <div style={{ display:'flex', gap:6 }}>
          {screenNav.map(s => {
            const d = DOMAINS[s.domain];
            const on = screen === s.id;
            return (
              <button key={s.id} onClick={() => setScreen(s.id)} style={{
                border: on?`1px solid ${d.color}60`:'1px solid rgba(255,255,255,0.09)',
                background: on?d.dim:'rgba(255,255,255,0.04)',
                color: on?d.color:'rgba(255,255,255,0.45)',
                borderRadius:99, padding:'6px 14px',
                fontSize:11, fontWeight: on?700:500, cursor:'pointer', fontFamily:'Inter',
                transition:'all 0.15s',
                boxShadow: on?`0 2px 10px ${d.glow}`:'none',
              }}>{s.label}</button>
            );
          })}
        </div>

        <IOSDevice width={375} height={812} dark={true}>
          <div style={{
            height:'100%',
            background:'linear-gradient(180deg, #0D0F1E 0%, #0A0C18 100%)',
            display:'flex', flexDirection:'column',
            fontFamily:'Inter, sans-serif',
            WebkitFontSmoothing:'antialiased',
            overflowX:'hidden', position:'relative',
          }}>
            <BgStars show={tweaks.sparkles}/>
            <div style={{ height:54, flexShrink:0 }}/>
            {screenMap[screen]}
            <BottomNav
              active={screen==='overview'?'overview':screen==='activities'?'activities':screen==='nutrition'?'nutrition':'body'}
              onChange={(id)=>setScreen(id)}
              accent={theme.accent} accentGlow={theme.accentGlow}
            />
          </div>
        </IOSDevice>

        <div style={{ fontSize:10, color:'rgba(255,255,255,0.25)', textAlign:'center', fontWeight:500 }}>
          Tap bottom nav or top pills to switch screens · Tweaks via toolbar
        </div>
      </div>

      {/* Right: doc panel */}
      {tweaks.doc && (
        <div style={{
          flex:1, minWidth:340, maxWidth:480,
          height:812, marginTop:40,
          background:'#0D0F1E', border:'1px solid rgba(255,255,255,0.08)',
          borderRadius:24, overflow:'hidden',
          boxShadow:'0 20px 60px rgba(0,0,0,0.5)',
          display:'flex', flexDirection:'column',
        }}>
          <DocPanel screenKey={screen} theme={theme}/>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
