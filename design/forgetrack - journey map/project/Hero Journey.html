<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Forgetrack — Hero Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="tokens.css" />
<style>
  @keyframes pulse {
    0% { transform: scale(1); opacity: 0.6; }
    70% { transform: scale(1.4); opacity: 0; }
    100% { transform: scale(1.4); opacity: 0; }
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(-4px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  body { background: #0A0C18; }
  .design-canvas-host { background: #0A0C18 !important; }
  /* notes column inside artboards */
  .notes {
    padding: 24px;
    color: #C7C2E0;
    font-size: 13px;
    line-height: 1.6;
    max-width: 380px;
  }
  .notes h3 {
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    color: #A78BFA; margin: 18px 0 8px; font-weight: 800;
  }
  .notes h3:first-child { margin-top: 0; }
  .notes p { margin: 0 0 10px; color: #C7C2E0; }
  .notes ul { margin: 0 0 10px; padding-left: 18px; }
  .notes li { margin-bottom: 6px; color: #C7C2E0; }
  .notes code {
    font-family: ui-monospace, SFMono-Regular, monospace;
    font-size: 11px;
    background: rgba(167,139,250,0.10);
    padding: 1px 6px; border-radius: 4px;
    color: #C4B5FD;
  }
  .pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.04em;
    background: rgba(244,193,82,0.15);
    color: #F4C152;
    margin-right: 6px;
  }
  .pill.rec { background: rgba(63,184,175,0.15); color: #3FB8AF; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="variants/MapVariant.jsx"></script>
<script type="text/babel" src="variants/TimelineVariant.jsx"></script>
<script type="text/babel" src="variants/HybridVariant.jsx"></script>
<script type="text/babel" src="variants/StatesVariant.jsx"></script>
<script type="text/babel" src="variants/DetailSheetVariant.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { DesignCanvas, DCSection, DCArtboard } = window;
const { IOSDevice } = window;

function PhoneArtboard({ children }) {
  return (
    <div style={{ display: 'flex', alignItems: 'flex-start', gap: 24 }}>
      <IOSDevice width={402} height={920} dark={true}>
        <div style={{ position: 'relative', width: '100%', height: '100%' }}>
          {children}
        </div>
      </IOSDevice>
    </div>
  );
}

function App() {
  return (
    <DesignCanvas
      title="Forgetrack — Hero Journey"
      subtitle="3 varianty pro RPG progression screen + stavy + detail sheet"
    >

      <DCSection id="intro" title="Úvod & doporučení" defaultOpen>
        <DCArtboard id="intro-1" label="Brief & systém" width={760} height={580}>
          <div className="notes" style={{ maxWidth: 720 }}>
            <h3>Úkol</h3>
            <p>
              Navrhnout <b>Hero Journey</b> screen, který ukáže hráčovu cestu časem —
              levely, tituly, achievementy, série a quest milníky — ve stylu „mapa
              dobrodružství", ne suchý výpis.
            </p>

            <h3>Vizuální systém</h3>
            <p>
              Převzato z Hero profilu: dark navy podklad <code>#0F1424</code>,
              glassmorphic karty, <span style={{color:'#A78BFA'}}>fialová</span> primárka,
              <span style={{color:'#F4C152'}}> zlatá</span> pro levely/XP,
              <span style={{color:'#3FB8AF'}}> tyrkysová</span> pro achievementy,
              <span style={{color:'#34D399'}}> zelená</span> pro questy.
              Každý typ události má vlastní barvu, ikonu a glow.
            </p>

            <h3>Tři varianty</h3>
            <ul>
              <li><b>Map Journey</b> — fantasy stezka s checkpointy. Wow efekt, novel UX.</li>
              <li><b>Timeline</b> — chronologický feed s filtry. Praktická, rychlá implementace.</li>
              <li><b>Hybrid</b> <span className="pill rec">DOPORUČENO</span> — minimapa nahoře + feed dole. Nejlepší poměr efektu/práce.</li>
            </ul>

            <h3>Doporučení pro 1. implementaci</h3>
            <p>
              <b>Hybrid varianta.</b> Má hero efekt mapy ale zachovává přehlednost
              feedu. Mini-mapa lze v MVP zjednodušit (statický SVG path s pár body),
              feed lze nasadit hned. <span className="pill">MVP</span> Map screen
              přidat v iteraci 2 jako „Otevřít celou mapu" prokliknutí.
            </p>

            <h3>Co statické vs. datově řízené</h3>
            <ul>
              <li><b>Statické:</b> tvar mapy, mountain decor SVG, ikony typů, barevný scheme</li>
              <li><b>Datově řízené:</b> pozice checkpointů (z eventů), level/title labels, XP, datumy, locked/done state, „TADY" position, stat counters</li>
            </ul>
          </div>
        </DCArtboard>
      </DCSection>

      <DCSection id="screens" title="Hlavní obrazovky" defaultOpen>
        <DCArtboard id="map" label="1. Map Journey" width={402} height={920}>
          <PhoneArtboard><window.MapVariant /></PhoneArtboard>
        </DCArtboard>

        <DCArtboard id="timeline" label="2. Timeline" width={402} height={920}>
          <PhoneArtboard><window.TimelineVariant /></PhoneArtboard>
        </DCArtboard>

        <DCArtboard id="hybrid" label="3. Hybrid (doporučeno)" width={402} height={920}>
          <PhoneArtboard><window.HybridVariant /></PhoneArtboard>
        </DCArtboard>
      </DCSection>

      <DCSection id="states" title="Stavy & detail" defaultOpen>
        <DCArtboard id="states-screen" label="Empty / Loading / Error" width={402} height={920}>
          <PhoneArtboard><window.StatesVariant /></PhoneArtboard>
        </DCArtboard>

        <DCArtboard id="detail" label="JourneyEventDetailSheet" width={402} height={920}>
          <PhoneArtboard><window.DetailSheetVariant /></PhoneArtboard>
        </DCArtboard>
      </DCSection>

      <DCSection id="flutter" title="Flutter handoff" defaultOpen>
        <DCArtboard id="components" label="Komponenty" width={760} height={780}>
          <div className="notes" style={{ maxWidth: 720 }}>
            <h3>Navržená struktura widgetů</h3>
            <ul>
              <li><code>JourneyMapScreen</code> — wrapper, AppBar + scrollable body, načítá <code>JourneyState</code> přes Riverpod/Bloc.</li>
              <li><code>JourneyHeaderCard</code> — current level + title pills (z Hero profilu, znovupoužité).</li>
              <li><code>JourneyMapView</code> — Stack z mountain SVG + path SVG + Positioned checkpointů. Bez CustomPainter; <code>SvgPicture.asset()</code> pro horské pozadí, path nakreslit ručně přes <code>Path()</code> v jednoduchém <code>CustomPainter</code> nebo SVG asset.</li>
              <li><code>JourneyCheckpointNode</code> — kruh s gradientem + ikonou + glow. <code>InkWell</code> opens detail sheet.</li>
              <li><code>JourneyEventFeed</code> — <code>SliverList</code> seskupený dle měsíce (<code>SliverStickyHeader</code>).</li>
              <li><code>JourneyEventCard</code> — řádek typ-icon + title + XP badge + relativní čas.</li>
              <li><code>JourneyEventDetailSheet</code> — <code>showModalBottomSheet</code> s gradient hero + meta gridem + CTA.</li>
              <li><code>JourneyPath</code> — buď <code>CustomPainter</code> (jeden <code>Path</code> + <code>Paint..shader = LinearGradient.createShader(...)</code>) nebo <b>jednodušší alternativa</b>: <code>SvgPicture.string()</code> z runtime-generovaného SVG s body checkpointů.</li>
            </ul>

            <h3>Doporučení: bez CustomPainter</h3>
            <p>
              Pro MVP použij <b>statický SVG asset</b> s předdefinovaným tvarem stezky a
              <b> <code>Stack</code> + <code>Positioned</code></b> pro checkpointy. Tvar mapy
              je „kanonický" — nemění se s daty, jen se po něm posouvá hráčova pozice
              a state checkpointů. Tím obejdeš CustomPainter úplně.
            </p>

            <h3>Animace</h3>
            <ul>
              <li>Pulse ring na current node — <code>AnimatedBuilder</code> + <code>Tween&lt;double&gt;</code> 1.0→1.4 scale, opacity 0.6→0.</li>
              <li>Path reveal po načtení — <code>AnimatedDrawnPath</code> nebo prostý fade in.</li>
              <li>Confetti / glow burst po unlocku — knihovna <code>confetti</code> nebo Lottie.</li>
            </ul>

            <h3>TODO / placeholders</h3>
            <ul>
              <li><code>// TODO</code> Backend ledger endpoint <code>GET /journey/events?since=…</code> — zatím mock z lokálního Hive boxu.</li>
              <li><code>// TODO</code> XP delta per event — odvodit z progression logu, jinak fallback per type (level=+250, achievement=+300…).</li>
              <li><code>// TODO</code> Custom mountain illustration assets — zatím SVG placeholder z brief screenshotu.</li>
              <li><code>// TODO</code> Sdílení události — share_plus integration (Sdílet button v detail sheet).</li>
              <li><code>// TODO</code> „Co tě čeká" preview v empty state — vyžaduje milestone roadmapu z backendu.</li>
            </ul>

            <h3>Lokalizace</h3>
            <p>
              Všechny stringy přes <code>AppLocalizations.of(context)</code>. Klíče jsem
              držel přirozené: <code>journey.title</code>, <code>journey.subtitle</code>,
              <code>journey.empty.title</code>, <code>journey.filter.all</code>, atd.
              Datumy přes <code>intl</code> s českým locale.
            </p>
          </div>
        </DCArtboard>
      </DCSection>

    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
