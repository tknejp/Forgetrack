<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Forgetrack – Flutter Design Handoff</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #04060E; font-family: 'Inter', sans-serif; color: #fff; }
#root { height: 100%; display: flex; }

.doc-scroll::-webkit-scrollbar { width: 4px; }
.doc-scroll::-webkit-scrollbar-track { background: transparent; }
.doc-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 99px; }

/* Tweaks */
#tweaks-panel { display:none; position:fixed; bottom:24px; right:24px; background:#0D1120; border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:20px; width:240px; z-index:9999; box-shadow:0 20px 60px rgba(0,0,0,0.7); }
#tweaks-panel.open { display:block; }
.tw-title { font-size:11px; font-weight:700; color:rgba(255,255,255,0.35); text-transform:uppercase; letter-spacing:0.1em; margin-bottom:16px; }
.tw-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.tw-label { font-size:13px; color:rgba(255,255,255,0.7); }
.tw-tog { width:38px; height:20px; background:rgba(255,255,255,0.12); border-radius:99px; cursor:pointer; position:relative; transition:background 0.2s; flex-shrink:0; }
.tw-tog.on { background:#3DD68C; }
.tw-tog::after { content:''; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:transform 0.2s; }
.tw-tog.on::after { transform:translateX(18px); }
</style>
</head>
<body>
<div id="root"></div>
<div id="tweaks-panel">
  <div class="tw-title">Tweaks</div>
  <div class="tw-row"><span class="tw-label">Screentone</span><div class="tw-tog on" id="tw-tex"></div></div>
  <div class="tw-row"><span class="tw-label">Bar animations</span><div class="tw-tog on" id="tw-anim"></div></div>
  <div class="tw-row"><span class="tw-label">Completion seals</span><div class="tw-tog on" id="tw-seal"></div></div>
  <div class="tw-row"><span class="tw-label">Doc panel</span><div class="tw-tog on" id="tw-doc"></div></div>
</div>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="ft-tokens.jsx"></script>
<script type="text/babel" src="ft-components.jsx"></script>
<script type="text/babel" src="ft-screens.jsx"></script>

<script type="text/babel">

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{"tex":true,"anim":true,"seal":true,"doc":true}/*EDITMODE-END*/;

// ── Handoff doc data ────────────────────────────────────────────────────
const SCREENS_DOC = {
  overview: {
    name: 'Overview / Dashboard',
    accentKey: 'steps',
    layout: ['AppBar (title + subtitle + avatar)', 'TabBar [Den · Týden · Měsíc]', 'DateNavigator (prev · label · Dnes · next)', 'SingleChildScrollView → Column', '  StatCard: Kroky', '  StatCard: Kalorie (expandable → MacroGrid)', '  StatCard: Váha', '  StatCard: Spánek'],
    components: [
      { name:'StatCard', widget:'Container(BoxDecoration)', note:'Gradient + border + screentone + card-in animation' },
      { name:'ChargeBar', widget:'Stack + AnimatedContainer', note:'3px track, glowing fill, leading dot pulse' },
      { name:'CompletionSeal', widget:'CustomPaint + RotationTransition', note:'Shown when progress ≥ 100%' },
      { name:'OctaBadge', widget:'ClipPath(OctagonClipper)', note:'Geometric icon container, per-domain color' },
      { name:'StatTriple', widget:'Row + Expanded', note:'3 cells with VerticalDivider, tabular-nums' },
      { name:'MacroMiniCard', widget:'Container(leftBorder)', note:'Inline in Kalorie expansion, 2-stop gradient' },
      { name:'FTTabBar', widget:'Row + AnimatedContainer', note:'Active tab gets gradient fill + glow shadow' },
      { name:'FTDateNav', widget:'Row + IconButton + Text', note:'"Dnes" badge when offset = 0' },
    ],
    states: [
      { s:'Default', desc:'Cards show real data with animated bar fill on mount' },
      { s:'Loading', desc:'Replace StatTriple with Row of ShimmerBox widgets (same geometry)' },
      { s:'Empty', desc:'Show dashed-border card with "—" values and muted colors' },
      { s:'Complete', desc:'Progress ≥ 1.0 → show CompletionSeal, bar glows full width' },
      { s:'Over goal', desc:'Calories card progress bar switches to "warning" red color key' },
    ],
    specs: ['Card padding: 14px top/bottom, 16px left/right', 'Card gap: 10px', 'Screen padding: 0 12px', 'Bar height: 3px logical px', 'OctaBadge size: 34px', 'Card border-radius: 16px', 'Status bar spacer: 52px', 'Bottom nav height: 56px + 22px safe area'],
    flutter: ['ClipPath for OctaBadge — write once, reuse everywhere', 'AnimatedContainer for bar fill, drive with CurvedAnimation(Curves.easeInOut)', 'Use ColorScheme extension for per-domain colors (AppColors.steps, etc.)', 'screentone: CustomPaint with dotGrid painter at 3% opacity', 'Shimmer loading: shimmer package or CustomPainter gradient sweep', 'TabBar: DefaultTabController with custom indicator (BoxDecoration)'],
  },
  activities: {
    name: 'Activities',
    accentKey: 'active',
    layout: ['AppBar', 'SingleChildScrollView → Column', '  SectionHeader "KROKY"', '  StatCard (stats + StatGrid)', '  SectionHeader "7DENNÍ TREND"', '  TrendChart (bar chart)', '  SectionHeader "AKTIVNÍ KALORIE"', '  StatCard (3-col)', '  SectionHeader "AKTIVNÍ MIN."', '  StatCard + bar', '  SectionHeader "TRÉNINKY"', '  StatGrid 2×3', '  SectionHeader "POSLEDNÍ TRÉNINKY"', '  ListView (ActivityRow × N)'],
    components: [
      { name:'SectionHeader', widget:'Row(Container bar + Text)', note:'3px color bar + uppercase label in domain color' },
      { name:'TrendChart', widget:'Row of Expanded(Column)', note:'AnimatedContainer height, today bar glows' },
      { name:'StatGrid', widget:'GridView.count(crossAxisCount:2)', note:'2-col grid of mini stat cells' },
      { name:'ActivityRow', widget:'ListTile / custom Row', note:'OctaBadge + name/date left, duration/kcal right' },
    ],
    states: [
      { s:'Default', desc:'All sections loaded with data' },
      { s:'Loading', desc:'Replace each section body with skeleton (shimmer bars)' },
      { s:'Empty workouts', desc:'"Žádné tréninky" with faint empty-state icon in card' },
      { s:'No data today', desc:'Show 0 with muted color, bar at 0%' },
    ],
    specs: ['SectionHeader margin-bottom: 8px', 'TrendChart height: 80px', 'ActivityRow height: ~56px', 'StatGrid gap: 6px', 'StatGrid cell border-radius: 12px', 'Sections gap: 10px'],
    flutter: ['TrendChart: Row of Expanded widgets, heights driven by data normalization', 'Use ListView.separated for workout list; avoid ListView.builder for short lists', 'StatGrid: GridView.count with shrinkWrap:true, physics:NeverScrollableScrollPhysics', 'Wrap the whole screen in SingleChildScrollView; avoid nested scrollables', 'SectionHeader: reuse exact same widget everywhere — 1 component, many colors'],
  },
  nutrition: {
    name: 'Nutrition',
    accentKey: 'calories',
    layout: ['AppBar', 'TabBar [Dnes · 7 dní · 30 dní]', 'SingleChildScrollView → Column', '  BigCalorieCard (hero kcal display)', '  MacroCard (Protein · Tuk · Sacharidy)', '  NutrientListCard (Vláknina · Cukry · Sůl · Nas. tuky)', '  TextButton "Upravit cíle"'],
    components: [
      { name:'BigCalorieCard', widget:'Container(BoxDecoration)', note:'Large number (28px/900) + goal right-aligned + ChargeBar' },
      { name:'MacroRow', widget:'Column(Row + SizedBox + LinearProgressIndicator)', note:'Over-limit triggers warning color key' },
      { name:'NutrientRow', widget:'Row + Divider', note:'No progress bar, value right-aligned' },
      { name:'OverWarning', widget:'Text(style: warningStyle)', note:'"X kcal over cíl" in warning red' },
    ],
    states: [
      { s:'Under goal', desc:'Bar fills partially, all text in domain color' },
      { s:'At goal', desc:'Full bar + CompletionSeal on BigCalorieCard' },
      { s:'Over goal', desc:'Bar overflows with warning color; macro row turns red if exceeded' },
      { s:'Loading', desc:'Shimmer for big number + skeleton rows' },
      { s:'No data', desc:'Dashes for all values, muted bar' },
    ],
    specs: ['Big calorie font: 28px / weight 900', 'Macro row label: 13px / 600', 'Macro row value: 12px / 700 tabular-nums', 'Nutrient row height: ~44px with divider', 'Bar height: 3px', '"Upravit cíle" button: right-aligned, 12px / 700 in accent color'],
    flutter: ['Over-limit state: compare value vs goal in ViewModel, pass colorKey to ChargeBar', 'MacroRow: Column with fixed-height ChargeBar — no intrinsic size issues', 'NutrientRow uses Divider(height:1, color:borderColor) between items', 'BigCalorieCard: Stack not needed — Column with Row handles layout cleanly', 'Tab switching: TabController; re-fetch or filter data by period in BLoC/Provider'],
  },
  body: {
    name: 'Body (Weight + Sleep)',
    accentKey: 'weight',
    layout: ['AppBar', 'SingleChildScrollView → Column', '  SectionHeader "VÁHA"', '  StatCard (triple + bar + TrendChart)', '  WeightGoalCard (start · now · goal + progress cells)', '  SectionHeader "SPÁNEK"', '  StatCard (triple + bar + TrendChart)', '  SleepStagesCard (3 stage cells)'],
    components: [
      { name:'TrendChart', widget:'Row of Expanded(Column)', note:'Same component, weight domain color (blue)' },
      { name:'WeightGoalCard', widget:'Container + Row(Expanded × 3)', note:'3-cell goal progress row' },
      { name:'SleepStagesCard', widget:'Row(Expanded × 3)', note:'Each stage: value + label + mini ChargeBar' },
      { name:'SectionHeader', widget:'Row', note:'Reused — different colorKey per section' },
    ],
    states: [
      { s:'Default', desc:'Weight and sleep data shown with charts' },
      { s:'Goal reached', desc:'WeightGoalCard shows CompletionSeal' },
      { s:'No weight entry today', desc:'Show last known weight in muted color with "—" for change' },
      { s:'No sleep data', desc:'SleepCard shows empty state with dashes and muted bar' },
    ],
    specs: ['Section gap: 10px', 'TrendChart height: 80px inside card', 'Sleep stage cell: flex:1, padding 8px', 'Weight goal bar: standard ChargeBar (3px)', 'Goal delta badge: borderRadius 99, padding 2/8px'],
    flutter: ['Body screen = two independent data streams (weight + sleep) — use FutureGroup or separate FutureBuilders', 'TrendChart is 100% reusable: pass List<ChartPoint> + Color, nothing else', 'SleepStages: same Row pattern as StatGrid but 3-col; do not create a separate widget', 'WeightGoalCard: compute pct = (start - current) / (start - goal), clamp 0–1'],
  },
};

// ── Doc panel component ─────────────────────────────────────────────────
function DocPanel({ screenKey }) {
  const [tab, setTab] = React.useState('layout');
  const doc = SCREENS_DOC[screenKey];
  if (!doc) return null;
  const { c } = FT.colors[doc.accentKey];

  const tabs = ['layout','components','specs','flutter'];
  const tabLabel = { layout:'Layout', components:'Components', specs:'Specs', flutter:'Flutter' };

  const chip = (txt, color) => (
    <span style={{ fontSize:10, fontFamily:'JetBrains Mono, monospace', color: color||c, background:`${color||c}18`, border:`1px solid ${color||c}35`, borderRadius:5, padding:'2px 6px', flexShrink:0 }}>{txt}</span>
  );
  const label = (txt) => <div style={{ fontSize:10, fontWeight:700, color:'rgba(255,255,255,0.3)', textTransform:'uppercase', letterSpacing:'0.1em', marginBottom:8, marginTop:16 }}>{txt}</div>;

  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100%' }}>
      {/* Screen name */}
      <div style={{ padding:'28px 24px 16px', borderBottom:'1px solid rgba(255,255,255,0.06)', flexShrink:0 }}>
        <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:4 }}>
          <div style={{ width:4, height:18, borderRadius:2, background:c }}/>
          <span style={{ fontSize:16, fontWeight:800, color:'#fff', letterSpacing:'-0.02em' }}>{doc.name}</span>
        </div>
        <div style={{ fontSize:11, color:'rgba(255,255,255,0.35)', marginLeft:12 }}>Flutter design specification</div>
      </div>

      {/* Doc tabs */}
      <div style={{ display:'flex', padding:'10px 16px 0', gap:4, flexShrink:0, borderBottom:'1px solid rgba(255,255,255,0.06)' }}>
        {tabs.map(t => (
          <button key={t} onClick={() => setTab(t)} style={{
            padding:'6px 12px 10px', border:'none', background:'transparent', cursor:'pointer',
            fontSize:12, fontWeight: t===tab?700:500,
            color: t===tab ? c : 'rgba(255,255,255,0.35)',
            borderBottom: t===tab ? `2px solid ${c}` : '2px solid transparent',
            transition:'all 0.15s', fontFamily:'Inter,sans-serif',
          }}>{tabLabel[t]}</button>
        ))}
      </div>

      {/* Doc content */}
      <div className="doc-scroll" style={{ flex:1, overflowY:'auto', padding:'4px 20px 32px' }}>

        {tab === 'layout' && <>
          {label('Screen layout tree')}
          <div style={{ fontFamily:'JetBrains Mono, monospace', fontSize:11, lineHeight:1.9, color:'rgba(255,255,255,0.65)' }}>
            {doc.layout.map((l,i) => {
              const indent = l.startsWith('  ') ? l.startsWith('    ') ? 2 : 1 : 0;
              return (
                <div key={i} style={{ paddingLeft: indent*14, color: indent===0 ? 'rgba(255,255,255,0.85)' : indent===1 ? 'rgba(255,255,255,0.6)' : 'rgba(255,255,255,0.4)' }}>
                  {indent>0 && <span style={{ color:`${c}70`, marginRight:4 }}>{'└'}</span>}
                  {l.trim()}
                </div>
              );
            })}
          </div>
        </>}

        {tab === 'components' && <>
          {label('Component inventory')}
          <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
            {doc.components.map((comp,i) => (
              <div key={i} style={{ background:'rgba(255,255,255,0.03)', border:'1px solid rgba(255,255,255,0.07)', borderRadius:10, padding:'10px 12px' }}>
                <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:4 }}>
                  <span style={{ fontSize:13, fontWeight:700, color:'#fff' }}>{comp.name}</span>
                  {chip(comp.widget)}
                </div>
                <div style={{ fontSize:11, color:'rgba(255,255,255,0.42)', lineHeight:1.5 }}>{comp.note}</div>
              </div>
            ))}
          </div>
          {label('Component states')}
          <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
            {doc.states.map((st,i) => (
              <div key={i} style={{ display:'flex', gap:10, background:'rgba(255,255,255,0.02)', border:'1px solid rgba(255,255,255,0.06)', borderRadius:9, padding:'9px 12px' }}>
                {chip(st.s, ['Default','Loading','Empty','No data','No weight entry today','No sleep data'].includes(st.s) ? 'rgba(255,255,255,0.45)' : st.s === 'Over goal' || st.s === 'Empty' ? FT.colors.warning.c : c)}
                <span style={{ fontSize:11, color:'rgba(255,255,255,0.5)', lineHeight:1.5 }}>{st.desc}</span>
              </div>
            ))}
          </div>
        </>}

        {tab === 'specs' && <>
          {label('Spacing & sizing')}
          <div style={{ display:'flex', flexDirection:'column', gap:5 }}>
            {doc.specs.map((s,i) => (
              <div key={i} style={{ display:'flex', alignItems:'baseline', gap:10, padding:'8px 10px', background:'rgba(255,255,255,0.02)', border:'1px solid rgba(255,255,255,0.05)', borderRadius:8 }}>
                <div style={{ width:5, height:5, borderRadius:'50%', background:c, flexShrink:0, marginTop:1 }}/>
                <span style={{ fontSize:11, fontFamily:'JetBrains Mono, monospace', color:'rgba(255,255,255,0.65)', lineHeight:1.5 }}>{s}</span>
              </div>
            ))}
          </div>
          {label('Global tokens')}
          <div style={{ display:'flex', flexWrap:'wrap', gap:6 }}>
            {Object.entries(FT.colors).map(([k,v]) => (
              <div key={k} style={{ display:'flex', alignItems:'center', gap:6, background:'rgba(255,255,255,0.03)', border:'1px solid rgba(255,255,255,0.06)', borderRadius:8, padding:'6px 10px' }}>
                <div style={{ width:12, height:12, borderRadius:3, background:v.c, flexShrink:0 }}/>
                <span style={{ fontSize:10, fontFamily:'JetBrains Mono, monospace', color:'rgba(255,255,255,0.55)' }}>{k}</span>
                <span style={{ fontSize:9, fontFamily:'JetBrains Mono, monospace', color:'rgba(255,255,255,0.3)' }}>{v.c}</span>
              </div>
            ))}
          </div>
        </>}

        {tab === 'flutter' && <>
          {label('Implementation notes')}
          <div style={{ display:'flex', flexDirection:'column', gap:7 }}>
            {doc.flutter.map((n,i) => (
              <div key={i} style={{ display:'flex', gap:10, background:'rgba(255,255,255,0.02)', border:'1px solid rgba(255,255,255,0.06)', borderRadius:9, padding:'10px 12px' }}>
                <span style={{ fontSize:11, fontWeight:800, color:c, flexShrink:0, width:18, textAlign:'right' }}>{i+1}.</span>
                <span style={{ fontSize:11, color:'rgba(255,255,255,0.58)', lineHeight:1.65 }}>{n}</span>
              </div>
            ))}
          </div>
          {label('Widget dependency map')}
          <div style={{ fontFamily:'JetBrains Mono, monospace', fontSize:10, lineHeight:2, color:'rgba(255,255,255,0.5)', background:'rgba(255,255,255,0.02)', border:'1px solid rgba(255,255,255,0.06)', borderRadius:10, padding:'12px 14px' }}>
            {['Scaffold','├── AppBar (custom)', '├── body: SingleChildScrollView','│   └── Column','│       ├── FTTabBar? (TabController)','│       ├── FTDateNav? (ValueNotifier<int>)','│       └── ... screen-specific widgets','└── bottomNavigationBar: FTBottomNav'].map((l,i) => (
              <div key={i} style={{ color: i===0?'#fff':i<3?'rgba(255,255,255,0.7)':'rgba(255,255,255,0.45)' }}>{l}</div>
            ))}
          </div>
        </>}
      </div>
    </div>
  );
}

// ── Root app ───────────────────────────────────────────────────────────
function Root() {
  const [screen, setScreen] = React.useState('overview');
  const [showDoc, setShowDoc] = React.useState(true);
  const [tweaks] = React.useState(TWEAK_DEFAULTS);

  const screenMap = {
    overview:   <ScreenOverview   key={screen} onNav={setScreen}/>,
    activities: <ScreenActivities key={screen} onNav={setScreen}/>,
    nutrition:  <ScreenNutrition  key={screen} onNav={setScreen}/>,
    body:       <ScreenBody       key={screen} onNav={setScreen}/>,
  };

  React.useEffect(() => {
    const panel = document.getElementById('tweaks-panel');
    const texEl  = document.getElementById('tw-tex');
    const animEl = document.getElementById('tw-anim');
    const sealEl = document.getElementById('tw-seal');
    const docEl  = document.getElementById('tw-doc');

    const tog = (el, cb) => el.addEventListener('click', () => { el.classList.toggle('on'); cb(el.classList.contains('on')); });
    tog(docEl, v => setShowDoc(v));
    tog(texEl,  () => {});
    tog(animEl, () => {});
    tog(sealEl, () => {});

    window.addEventListener('message', e => {
      if (e.data?.type === '__activate_edit_mode')   panel.classList.add('open');
      if (e.data?.type === '__deactivate_edit_mode') panel.classList.remove('open');
    });
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
  }, []);

  const screenNav = [
    { id:'overview',   label:'Overview' },
    { id:'activities', label:'Activities' },
    { id:'nutrition',  label:'Nutrition' },
    { id:'body',       label:'Body' },
  ];

  return (
    <div style={{ display:'flex', width:'100%', minHeight:'100vh', alignItems:'flex-start', padding:'32px 28px 60px', gap:40, flexWrap:'wrap' }}>
      <style>{`
        @keyframes ft-bar-in{from{width:0%}}
        @keyframes ft-card-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        @keyframes ft-seal-in{from{opacity:0;transform:scale(0.5) rotate(-12deg)}to{opacity:1;transform:scale(1) rotate(0deg)}}
        @keyframes ft-ring-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
        @keyframes ft-dot-pulse{0%,100%{opacity:1}50%{opacity:0.6}}
        ::-webkit-scrollbar{width:0}
      `}</style>

      {/* ── Left: phone + screen switcher ── */}
      <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:16, flexShrink:0 }}>
        <div style={{ display:'flex', gap:6 }}>
          {screenNav.map(s => {
            const { c } = FT.colors[s.id==='overview'?'steps':s.id==='activities'?'active':s.id==='nutrition'?'calories':'weight'];
            const on = screen === s.id;
            return (
              <button key={s.id} onClick={() => setScreen(s.id)} style={{
                border: on?`1px solid ${c}60`:'1px solid rgba(255,255,255,0.09)',
                background: on?`${c}18`:'rgba(255,255,255,0.04)',
                color: on?c:'rgba(255,255,255,0.45)',
                borderRadius:99, padding:'5px 14px',
                fontSize:11, fontWeight:on?700:500, cursor:'pointer', fontFamily:'Inter',
                transition:'all 0.15s',
              }}>{s.label}</button>
            );
          })}
        </div>

        <IOSDevice width={375} height={812} dark={true}>
          {screenMap[screen]}
        </IOSDevice>

        <div style={{ fontSize:10, color:'rgba(255,255,255,0.2)', textAlign:'center', fontWeight:500 }}>
          Tap bottom nav to switch screens · Tweaks via toolbar
        </div>
      </div>

      {/* ── Right: doc panel ── */}
      {showDoc && (
        <div style={{
          flex:1, minWidth:340, maxWidth:480,
          height:812, marginTop:40,
          background:'#0B0D1C', border:'1px solid rgba(255,255,255,0.08)',
          borderRadius:24, overflow:'hidden',
          boxShadow:'0 20px 60px rgba(0,0,0,0.5)',
          display:'flex', flexDirection:'column',
        }}>
          <DocPanel screenKey={screen}/>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>

<template id="__bundler_thumbnail">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80">
  <rect width="120" height="80" fill="#07090F"/>
  <rect x="8" y="8" width="36" height="64" rx="5" fill="#0D1020" stroke="#1a1d2e" stroke-width="0.8"/>
  <rect x="11" y="14" width="30" height="3" rx="1.5" fill="#3DD68C" opacity="0.7"/>
  <rect x="11" y="21" width="30" height="9" rx="2.5" fill="#3DD68C" opacity="0.12"/>
  <rect x="11" y="34" width="30" height="9" rx="2.5" fill="#FF6B35" opacity="0.12"/>
